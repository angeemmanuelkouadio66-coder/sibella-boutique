<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Administration — Si’Bella</title>
<style>
:root{--rose:#ffd3e4;--mag:#b0125b;--gold:#c99a2e;--ink:#4a1030}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:#fff1f7;color:var(--ink)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#fff;border-bottom:2px solid var(--gold)}
h1{font-size:1.2rem;margin:0;color:var(--mag)}
main{max-width:720px;margin:0 auto;padding:16px}
section{background:#fff;border:2px solid #f4d27a;border-radius:16px;padding:16px;margin-bottom:18px}
h2{margin:0 0 10px;font-size:1.1rem;color:var(--mag)}
label{display:block;margin:10px 0 3px;font-weight:600}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;padding:10px;border:2px solid #f4d27a;border-radius:10px;background:#fff}
input[type=checkbox]{width:auto;margin-right:8px}
.chk{display:flex;align-items:center;font-weight:600;margin-top:10px}
button{border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--mag);color:#fff}
button.sec{background:#fff;color:var(--ink);border:2px solid var(--gold)}
button.del{background:#8a1c1c}
button:disabled{opacity:.6}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#prev{width:120px;height:120px;object-fit:cover;border-radius:12px;margin-top:8px;background:var(--rose)}
.item{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--rose)}
.item img{width:64px;height:64px;object-fit:cover;border-radius:10px;background:var(--rose)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.acts button{padding:7px 12px;font-size:.9rem}
.msg{margin-top:10px;font-weight:600}.ok{color:#1b7a3d}.err{color:#b00020}
.zone{display:grid;grid-template-columns:1fr 90px auto auto;gap:6px;align-items:center;margin-bottom:6px}
.zone button{padding:8px 10px;font-size:.85rem}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><h1>Si’Bella — Administration</h1><button class="sec" id="out" hidden>Déconnexion</button></header>
<main>

<section id="login">
  <h2>Connexion</h2>
  <form id="fl">
    <label>Email<input id="em" type="email" autocomplete="username" required></label>
    <label>Mot de passe<input id="pw" type="password" autocomplete="current-password" required></label>
    <p><button type="submit">Se connecter</button></p>
    <div class="msg" id="ml"></div>
  </form>
</section>

<div id="app" hidden>
  <section>
    <h2 id="titreForm">Ajouter un article</h2>
    <form id="fp">
      <label>Photo<input id="photo" type="file" accept="image/*"></label>
      <img id="prev" alt="" hidden>
      <label>Nom de l’article<input id="nom" required></label>
      <div class="row2">
        <label>Prix (FCFA)<input id="prix" type="number" min="0" inputmode="numeric" required></label>
        <label>Ancien prix (si promo)<input id="ancien" type="number" min="0" inputmode="numeric"></label>
      </div>
      <label>Catégorie<select id="cat"><option value="chaussures">Chaussures</option><option value="sacs">Sacs</option></select></label>
      <label>Couleurs (séparées par des virgules)<input id="couleurs" placeholder="Noir, Rouge"></label>
      <label>Pointures (séparées par des virgules)<input id="pointures" placeholder="37, 38, 39"></label>
      <label>Longueurs de pied en cm<input id="cm" placeholder="23,5 à 26"></label>
      <label>Étiquette<select id="etiq"><option value="">Aucune</option><option>Nouveau</option><option>Promo</option><option>Dernières pièces</option></select></label>
      <label>Description<textarea id="desc" rows="3"></textarea></label>
      <label class="chk"><input id="pop" type="checkbox"> Meilleure vente (page d’accueil)</label>
      <label class="chk"><input id="epuise" type="checkbox"> Épuisé</label>
      <p><button type="submit" id="bsave">Publier</button> <button type="button" class="sec" id="cancel" hidden>Annuler</button></p>
      <div class="msg" id="mp"></div>
    </form>
  </section>

  <section>
    <h2>Mes articles (<span id="nb">0</span>)</h2>
    <div id="liste">Chargement…</div>
  </section>

  <section>
    <h2>Frais de livraison</h2>
    <small>Laisse le prix vide pour « à confirmer sur WhatsApp ».</small>
    <div id="zones" style="margin-top:10px"></div>
    <h3 style="margin:14px 0 6px">Ajouter une zone</h3>
    <div class="zone"><input id="zn" placeholder="Zone"><input id="zp" type="number" min="0" placeholder="Prix"><button id="zadd">Ajouter</button><span></span></div>
    <div class="msg" id="mz"></div>
  </section>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL="https://swxtcfrhonijjcsbrldg.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN3eHRjZnJob25pampjc2JybGRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ3NjUyNTUsImV4cCI6MjExMDM0MTI1NX0.MfA87LwUJWZpfg6dlkf5pSgPnJWCeKVuA4hTDbkoTMg";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const msg=(el,t,ok)=>{el.textContent=t;el.className="msg "+(ok?"ok":"err")};
const fmt=n=>Number(n).toLocaleString("fr-FR")+" FCFA";
let LISTE=[],editId=null,photoActuelle="";

/* ---- Connexion ---- */
async function demarrer(){
  const {data}=await sb.auth.getSession();
  if(!data.session){$("#login").hidden=false;$("#app").hidden=true;$("#out").hidden=true;return}
  const {data:ok}=await sb.rpc("is_admin");
  if(!ok){await sb.auth.signOut();msg($("#ml"),"Ce compte n’est pas administrateur.");$("#login").hidden=false;return}
  $("#login").hidden=true;$("#app").hidden=false;$("#out").hidden=false;
  chargerListe();chargerZones();
}
$("#fl").addEventListener("submit",async e=>{
  e.preventDefault();msg($("#ml"),"Connexion…",true);
  const {error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
  if(error){msg($("#ml"),"Email ou mot de passe incorrect.");return}
  $("#pw").value="";msg($("#ml"),"",true);demarrer();
});
$("#out").addEventListener("click",async()=>{await sb.auth.signOut();demarrer()});

/* ---- Photos ---- */
function compress(file){return new Promise((ok,ko)=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const r=Math.min(1,1000/Math.max(img.width,img.height)),c=document.createElement("canvas");
    c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
    c.toBlob(b=>b?ok(b):ko(new Error("Compression impossible")),"image/jpeg",.8)};
  img.onerror=()=>ko(new Error("Image illisible"));img.src=u})}
const chemin=u=>{const i=String(u).indexOf("/photos/");return i<0?null:decodeURIComponent(u.slice(i+8))};
const retirer=u=>{const c=chemin(u);return c?sb.storage.from("photos").remove([c]):null};
$("#photo").addEventListener("change",()=>{
  const f=$("#photo").files[0];
  if(f){$("#prev").src=URL.createObjectURL(f);$("#prev").hidden=false}
});

/* ---- Articles ---- */
async function chargerListe(){
  const {data,error}=await sb.from("produits").select("*").order("created_at",{ascending:false});
  if(error){$("#liste").textContent="Erreur : "+error.message;return}
  LISTE=data;$("#nb").textContent=data.length;
  $("#liste").innerHTML=data.length?data.map(p=>`<div class="item"><img src="${esc(p.photo)}" alt=""><div><b>${esc(p.nom)}</b><br>${fmt(p.prix)} · ${esc(p.categorie)}${p.epuise?" · <b>Épuisé</b>":""}${p.populaire?" · ★":""}<div class="acts"><button class="sec" data-e="${p.id}">Modifier</button><button class="sec" data-s="${p.id}">${p.epuise?"Remettre en stock":"Marquer épuisé"}</button><button class="del" data-d="${p.id}">Supprimer</button></div></div></div>`).join(""):"<p>Aucun article pour l’instant.</p>";
}
function remplir(p){
  editId=p?p.id:null;photoActuelle=p?p.photo||"":"";
  $("#nom").value=p?p.nom:"";$("#prix").value=p?p.prix:"";$("#ancien").value=p&&p.ancien_prix?p.ancien_prix:"";
  $("#cat").value=p?p.categorie:"chaussures";$("#couleurs").value=p?p.couleurs||"":"";
  $("#pointures").value=p?p.pointures||"":"";$("#cm").value=p?p.cm||"":"";
  $("#etiq").value=p?p.etiquette||"":"";$("#desc").value=p?p.description||"":"";
  $("#pop").checked=!!(p&&p.populaire);$("#epuise").checked=!!(p&&p.epuise);
  $("#photo").value="";$("#prev").src=photoActuelle;$("#prev").hidden=!photoActuelle;
  $("#titreForm").textContent=p?"Modifier l’article":"Ajouter un article";
  $("#bsave").textContent=p?"Enregistrer les modifications":"Publier";$("#cancel").hidden=!p;
}
$("#cancel").addEventListener("click",()=>{remplir(null);msg($("#mp"),"",true)});

$("#fp").addEventListener("submit",async e=>{
  e.preventDefault();const b=$("#bsave");b.disabled=true;msg($("#mp"),"Envoi en cours…",true);
  try{
    let url=photoActuelle;const f=$("#photo").files[0],ancienneUrl=photoActuelle;
    if(f){
      const blob=await compress(f),nom=Date.now()+"-"+Math.random().toString(36).slice(2,8)+".jpg";
      const {error}=await sb.storage.from("photos").upload(nom,blob,{contentType:"image/jpeg"});
      if(error)throw error;
      url=sb.storage.from("photos").getPublicUrl(nom).data.publicUrl;
    }
    if(!url)throw new Error("Choisis une photo.");
    const row={nom:$("#nom").value.trim(),prix:parseInt($("#prix").value)||0,ancien_prix:parseInt($("#ancien").value)||0,
      categorie:$("#cat").value,photo:url,couleurs:$("#couleurs").value.trim(),pointures:$("#pointures").value.trim(),
      cm:$("#cm").value.trim(),populaire:$("#pop").checked,etiquette:$("#etiq").value||null,
      epuise:$("#epuise").checked,description:$("#desc").value.trim()};
    const q=editId?sb.from("produits").update(row).eq("id",editId):sb.from("produits").insert(row);
    const {error}=await q;if(error)throw error;
    if(f&&editId&&ancienneUrl)await retirer(ancienneUrl);
    remplir(null);msg($("#mp"),"Article enregistré ✓",true);chargerListe();
  }catch(err){msg($("#mp"),"Erreur : "+(err.message||err))}
  b.disabled=false;
});

$("#liste").addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.e){remplir(LISTE.find(p=>p.id===b.dataset.e));scrollTo({top:0,behavior:"smooth"})}
  else if(b.dataset.s){const p=LISTE.find(x=>x.id===b.dataset.s);
    const {error}=await sb.from("produits").update({epuise:!p.epuise}).eq("id",p.id);
    if(error)alert("Erreur : "+error.message);chargerListe()}
  else if(b.dataset.d){const p=LISTE.find(x=>x.id===b.dataset.d);
    if(!confirm("Supprimer « "+p.nom+" » ? Cette action est définitive."))return;
    const {error}=await sb.from("produits").delete().eq("id",p.id);
    if(error){alert("Erreur : "+error.message);return}
    await retirer(p.photo);chargerListe()}
});

/* ---- Frais de livraison ---- */
async function chargerZones(){
  const {data,error}=await sb.from("livraison").select("*").order("id");
  if(error){$("#zones").textContent="Erreur : "+error.message;return}
  $("#zones").innerHTML=data.map(z=>`<div class="zone"><span>${esc(z.zone)}</span><input type="number" min="0" value="${z.prix==null?"":z.prix}" data-p="${z.id}" placeholder="à confirmer"><button class="sec" data-zs="${z.id}">OK</button><button class="del" data-zd="${z.id}">✕</button></div>`).join("");
}
$("#zones").addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.zs){const v=document.querySelector('[data-p="'+b.dataset.zs+'"]').value;
    const {error}=await sb.from("livraison").update({prix:v===""?null:parseInt(v)}).eq("id",b.dataset.zs);
    msg($("#mz"),error?"Erreur : "+error.message:"Tarif enregistré ✓",!error)}
  else if(b.dataset.zd){if(!confirm("Supprimer cette zone ?"))return;
    const {error}=await sb.from("livraison").delete().eq("id",b.dataset.zd);
    if(error)msg($("#mz"),"Erreur : "+error.message);chargerZones()}
});
$("#zadd").addEventListener("click",async()=>{
  const z=$("#zn").value.trim();if(!z)return;
  const v=$("#zp").value;
  const {error}=await sb.from("livraison").insert({zone:z,prix:v===""?null:parseInt(v)});
  if(error){msg($("#mz"),"Erreur : "+error.message);return}
  $("#zn").value="";$("#zp").value="";msg($("#mz"),"Zone ajoutée ✓",true);chargerZones();
});

demarrer();
</script>
</body>
                        </html>z
